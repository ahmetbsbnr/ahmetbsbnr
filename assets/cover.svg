    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity=".075" stroke-width="1"/></pattern>
    <clipPath id="shape"><rect width="1200" height="450" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
